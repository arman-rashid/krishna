<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The End</title>
<style>
  :root {
    --bg-top: #0a0a0d;
    --bg-bottom: #17151c;
    --ink: #f2ede4;
    --ember: #c9a15a;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-top);
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', 'Georgia', serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.4rem, 8vw, 5.5rem);
    color: var(--ink);
    letter-spacing: 0.03em;
    opacity: 0;
    filter: blur(6px);
    animation: emerge 3s ease-out 0.4s forwards;
  }
  .rule {
    margin: 1.6rem auto 0;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ember), transparent);
    animation: widen 2.5s ease-out 2.2s forwards;
  }
  @keyframes emerge {
    0% { opacity: 0; filter: blur(10px); transform: scale(0.96); }
    100% { opacity: 1; filter: blur(0); transform: scale(1); }
  }
  @keyframes widen {
    to { width: 220px; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; opacity: 1; filter: none; }
    .rule { animation: none; width: 220px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stage">
  <h1>The End</h1>
  <div class="rule"></div>
</div>

<script>
// Slow drifting embers rising into darkness, like the last light of a fire.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, particles;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function makeParticle() {
  return {
    x: Math.random() * w,
    y: h + Math.random() * 100,
    r: Math.random() * 1.6 + 0.4,
    speed: Math.random() * 0.4 + 0.15,
    drift: (Math.random() - 0.5) * 0.3,
    life: Math.random() * 1,
    flicker: Math.random() * 0.02 + 0.005
  };
}

particles = Array.from({ length: 70 }, makeParticle);

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0a0d');
  grad.addColorStop(1, '#1a1620');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  for (const p of particles) {
    p.y -= p.speed;
    p.x += p.drift;
    p.life += p.flicker;
    const alpha = (Math.sin(p.life * Math.PI) * 0.5 + 0.2) * (1 - p.y / (h + 100) < 0.9 ? 1 : 0.3);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201, 161, 90, ${Math.max(alpha, 0)})`;
    ctx.fill();

    if (p.y < -20) {
      Object.assign(p, makeParticle(), { y: h + 20 });
    }
  }
  requestAnimationFrame(draw);
}

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!prefersReducedMotion) {
  draw();
} else {
  ctx.fillStyle = '#14121a';
  ctx.fillRect(0, 0, w, h);
}
</script>
</body>
</html>
