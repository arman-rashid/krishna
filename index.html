<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you don't deserve this</title>
<style>
  :root {
    --ink: #eae6df;
    --bg: #0e0d0c;
    --fade: #6b655c;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    overflow: hidden;
  }
  .wrap {
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    animation: rise 2.2s ease-out forwards;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 3rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.3;
    margin: 0;
    color: var(--ink);
  }
  .line {
    width: 40px;
    height: 1px;
    background: var(--fade);
    margin: 1.6rem auto 0;
    transform: scaleX(0);
    animation: grow 1.6s ease-out 1.4s forwards;
    transform-origin: center;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes grow {
    to { transform: scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap, .line { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>you don't deserve this</h1>
    <div class="line"></div>
  </div>
</body>
</html>
